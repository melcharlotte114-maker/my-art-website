<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shop | Wu Chia Hsuan</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Wu Chia Hsuan</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="works.html">Works</a>
            <a href="about.html">About</a>
            <a href="shop.html">Shop</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <section class="shop-page">

            <p class="shop-label">THE COLLECTION</p>

            <h2>Shop</h2>

            <p class="shop-intro">
                Explore a selection of artworks, prints,
                and creative objects.
            </p>

            <div class="shop-grid">

                <div class="shop-item">
                    <div class="shop-placeholder">
                        Product Image
                    </div>

                    <h3>Coming Soon</h3>
                    <p>New collection in preparation</p>
                </div>

            </div>

        </section>
    </main>

    <footer>
        <p>Copyright 2026 Wu Chia Hsuan</p>
    </footer>

    <script>
document.addEventListener("DOMContentLoaded", function () {
    const shopText = document.querySelectorAll(
        ".shop-page > .shop-label, .shop-page > h2, .shop-page > .shop-intro"
    );

    const observer = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
            if (entry.isIntersecting) {
                entry.target.classList.add("is-visible");
                observer.unobserve(entry.target);
            }
        });
    }, {
        threshold: 0.2
    });

    shopText.forEach((element) => observer.observe(element));
});
</script>
</body>
</html>
