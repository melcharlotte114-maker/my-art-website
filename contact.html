<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact | My Art Studio</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <h1>My Art Studio</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="index.html#gallery">Works</a>
            <a href="#">About</a>
            <a href="#">Shop</a>
            <a href="contact.html">Contact</a>
        </nav>

    </header>


    <main>

        <section class="contact">

            <h2>Contact</h2>

            <p>
                For artwork inquiries, please get in touch.
            </p>
  <form action="https://formspree.io/f/xeaeedgl" method="POST">

    <label for="artwork">Artwork</label>

    <input
        type="text"
        id="artwork"
        name="artwork"
        readonly
    >


    <label for="name">Name</label>

    <input
        type="text"
        id="name"
        name="name"
        required
    >


    <label for="email">Email</label>

    <input
        type="email"
        id="email"
        name="email"
        required
    >


    <label for="message">Message</label>

    <textarea
        id="message"
        name="message"
        required
    ></textarea>


    <label class="privacy-consent">

        <input
            type="checkbox"
            id="privacy"
            name="privacy"
            required
        >

        <span>
            I agree to the processing of my personal data
            for the purpose of responding to my inquiry,
            as described in the
            <a href="privacy.html" target="_blank">Privacy Policy</a>.
        </span>

    </label>


    <button type="submit">Send Inquiry</button>

</form>

    </main>


    <footer>

        <p>Copyright 2026 My Art Studio</p>

    </footer>

    <script src="artworks.js"></script>
    <script src="contact.js"></script>

</body>

</html>
