    <header>
        <h1>Wu Chia Hsuan</h1>

        <nav>
            <a href="index.html">Home</a>

            <a href="about.html">About</a>
            <a href="shop.html">Shop</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <section class="works-page">

            <p class="works-label">PORTFOLIO</p>

            <h2>Projets</h2>

            <p class="works-intro">
                Explore a collection of creative projects, each with its own story.

                <!-- Artworks will appear here -->

    <script src="artworks.js"></script>
    <script src="projects.js"></script>
    <script src="works.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {
    const worksText = document.querySelectorAll(
        ".works-page > h2, .works-page > .works-intro"
    );

    const observer = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
            if (entry.isIntersecting) {
                entry.target.classList.add("is-visible");
                observer.unobserve(entry.target);
            }
        });
    }, {
        threshold: 0.2
    });

    worksText.forEach((element) => {
        observer.observe(element);
    });
});
</script>
</body>
